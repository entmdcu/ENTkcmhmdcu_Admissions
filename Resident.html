<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรับสมัครแพทย์ประจำบ้าน - ENT MDCU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-2 text-[#ce1255]">ใบสมัครแพทย์ประจำบ้าน ประจำปีการศึกษา 2570</h1>
        <p class="text-center text-gray-600 mb-8">ภาควิชาโสต ศอ นาสิกวิทยา คณะแพทยศาสตร์ จุฬาลงกรณ์มหาวิทยาลัย</p>

        <!-- Tabs -->
        <div class="flex border-b mb-6">
            <button onclick="switchTab('new')" class="py-2 px-4 text-[#ce1255] border-b-2 border-[#ce1255] font-bold" id="tab-new">กรอกใบสมัครใหม่</button>
            <button onclick="switchTab('edit')" class="py-2 px-4 text-gray-500 hover:text-[#ce1255]" id="tab-edit">แก้ไข/แนบเอกสารเพิ่มเติม</button>
        </div>

        <!-- Section: ค้นหาข้อมูล (ซ่อนไว้เป็นค่าเริ่มต้น) -->
        <div id="section-edit" class="hidden bg-white p-6 rounded-lg shadow-sm border mb-6">
            <h2 class="text-xl font-bold mb-4">ค้นหาข้อมูลผู้สมัคร</h2>
            <div class="flex gap-4">
                <input type="text" id="searchId" placeholder="กรอกรหัสผู้สมัคร เช่น ENT70-01/2570" class="flex-1 border p-2 rounded">
                <button onclick="searchData()" class="bg-[#ce1255] text-white px-6 py-2 rounded">ค้นหา</button>
            </div>
            <p id="searchStatus" class="text-sm text-red-500 mt-2"></p>
        </div>

        <!-- ฟอร์มรับสมัคร -->
        <form id="applicationForm" class="bg-white p-8 rounded-lg shadow-sm border space-y-8" onsubmit="submitForm(event)">
            
            <!-- 1. ข้อมูลส่วนตัว -->
            <section>
                <h2 class="text-xl font-bold border-b pb-2 mb-4 text-[#ce1255]">1. ข้อมูลส่วนตัว</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block mb-1">ชื่อ - สกุล (ภาษาไทย)</label><input type="text" name="nameTh" required class="w-full border p-2 rounded"></div>
                    <div><label class="block mb-1">ชื่อ - สกุล (อังกฤษ)</label><input type="text" name="nameEn" required class="w-full border p-2 rounded"></div>
                    <div><label class="block mb-1">เลขประจำตัวประชาชน</label><input type="text" name="idCard" required class="w-full border p-2 rounded"></div>
                    <div><label class="block mb-1">E-mail (สำหรับรับ PDF)</label><input type="email" name="email" required class="w-full border p-2 rounded"></div>
                </div>
            </section>

            <!-- 5. ประวัติการศึกษา -->
            <section>
                <h2 class="text-xl font-bold border-b pb-2 mb-4 text-[#ce1255]">5. ประวัติการศึกษา และคุณวุฒิทางการศึกษา</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block mb-1">สถาบันที่สำเร็จการศึกษา</label><input type="text" name="medSchool" class="w-full border p-2 rounded"></div>
                    <div><label class="block mb-1">เกรดเฉลี่ย</label><input type="number" step="0.01" name="gpa" class="w-full border p-2 rounded"></div>
                </div>
                <div class="mt-4 p-4 bg-gray-50 rounded">
                    <p class="font-bold mb-2">ผลการสอบ ศรว.</p>
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block mb-1 text-sm">ขั้นตอนที่ 1</label>
                            <select name="nl1" class="w-full border p-2 rounded"><option value="ผ่าน">ผ่าน</option><option value="ไม่ผ่าน">ไม่ผ่าน</option></select>
                        </div>
                        <div>
                            <label class="block mb-1 text-sm">ขั้นตอนที่ 2</label>
                            <select name="nl2" class="w-full border p-2 rounded"><option value="ผ่าน">ผ่าน</option><option value="ไม่ผ่าน">ไม่ผ่าน</option></select>
                        </div>
                        <div>
                            <label class="block mb-1 text-sm">ขั้นตอนที่ 3 OSCE</label>
                            <select name="nl3" class="w-full border p-2 rounded"><option value="ผ่าน">ผ่าน</option><option value="ไม่ผ่าน">ไม่ผ่าน</option></select>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 7. สถาบันที่ต้องการสมัคร -->
            <section>
                <h2 class="text-xl font-bold border-b pb-2 mb-4 text-[#ce1255]">7. เลือกสถาบันฝึกอบรม (เลือกได้สูงสุด 5 อันดับ)</h2>
                <div id="choices-container" class="space-y-3">
                    <!-- ตัวอย่างลำดับที่ 1 -->
                    <div>
                        <label class="block mb-1">ลำดับที่ 1</label>
                        <select name="choice1" class="w-full border p-2 rounded">
                            <option value="">-- เลือกสถาบัน --</option>
                            <option value="คณะแพทยศาสตร์ จุฬาลงกรณ์มหาวิทยาลัย">1. คณะแพทยศาสตร์ จุฬาลงกรณ์มหาวิทยาลัย</option>
                            <option value="คณะแพทยศาสตร์ ศิริราชพยาบาล">2. คณะแพทยศาสตร์ ศิริราชพยาบาล</option>
                            <option value="คณะแพทยศาสตร์ โรงพยาบาลรามาธิบดี">3. คณะแพทยศาสตร์ โรงพยาบาลรามาธิบดี</option>
                            <option value="วิทยาลัยแพทยศาสตร์พระมงกุฎเกล้า">4. วิทยาลัยแพทยศาสตร์พระมงกุฎเกล้า</option>
                            <option value="คณะแพทยศาสตร์วชิรพยาบาล">5. คณะแพทยศาสตร์วชิรพยาบาล</option>
                            <!-- นำรายชื่อทั้ง 12 สถาบันมาใส่ให้ครบ -->
                        </select>
                    </div>
                </div>
            </section>

            <!-- เอกสารแนบ -->
            <section>
                <h2 class="text-xl font-bold border-b pb-2 mb-4 text-[#ce1255]">อัปโหลดเอกสาร (PDF หรือรูปภาพ)</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block mb-1">1. ใบอนุญาตประกอบวิชาชีพเวชกรรม</label>
                        <input type="file" name="fileLicense" accept=".pdf,.jpg,.jpeg,.png" class="w-full">
                    </div>
                    <div>
                        <label class="block mb-1">2. ใบแสดงผลการศึกษา (Transcript)</label>
                        <input type="file" name="fileTranscript" accept=".pdf,.jpg,.jpeg,.png" class="w-full">
                    </div>
                </div>
            </section>

            <input type="hidden" name="appId" id="appId" value="">
            
            <button type="submit" id="submitBtn" class="w-full bg-[#ce1255] hover:bg-pink-700 text-white font-bold py-3 rounded-lg mt-6">
                ส่งใบสมัคร
            </button>
        </form>
    </div>

    <script>
        // URL ของ Google Apps Script Web App ที่เราจะนำมาใส่ทีหลัง
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQxg4jU3ROgThdNXvEJNLgKc6O4tv29_Gp5tcMAOA94V8UbCwNY-ZL7fBNOcD2iMFZ/exec';

        function switchTab(tab) {
            if(tab === 'new') {
                document.getElementById('section-edit').classList.add('hidden');
                document.getElementById('applicationForm').reset();
                document.getElementById('appId').value = '';
                document.getElementById('tab-new').classList.add('text-[#ce1255]', 'border-b-2', 'border-[#ce1255]', 'font-bold');
                document.getElementById('tab-edit').classList.remove('text-[#ce1255]', 'border-b-2', 'border-[#ce1255]', 'font-bold');
            } else {
                document.getElementById('section-edit').classList.remove('hidden');
                document.getElementById('tab-edit').classList.add('text-[#ce1255]', 'border-b-2', 'border-[#ce1255]', 'font-bold');
                document.getElementById('tab-new').classList.remove('text-[#ce1255]', 'border-b-2', 'border-[#ce1255]', 'font-bold');
            }
        }

        // โค้ดสำหรับดึงข้อมูลและส่งข้อมูลจะถูกเขียนเชื่อมกับ Apps Script ที่นี่
    </script>
</body>
</html>
