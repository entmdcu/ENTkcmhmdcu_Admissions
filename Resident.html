<!-- 8. เอกสารแนบ (อัปโหลด) -->
            <section>
                <div class="border-b-2 border-pink-100 pb-2 mb-6">
                    <h2 class="text-3xl font-bold text-chula">8. อัปโหลดเอกสารประกอบการสมัคร</h2>
                    <p class="text-gray-500 mt-2 text-base">รองรับไฟล์นามสกุล .pdf, .jpg, .png (หากต้องการเลือกหลายไฟล์ในช่องเดียวกัน ให้กดปุ่ม Ctrl หรือ Cmd ค้างไว้ขณะเลือกไฟล์)</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-white">
                    
                    <!-- 1. บัตรประชาชน -->
                    <div>
                        <label class="block font-semibold mb-2">1. สำเนาบัตรประจำตัวประชาชน</label>
                        <input type="file" name="fileIdCard" accept=".pdf,.jpg,.jpeg,.png" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 focus:ring-2 focus:ring-pink-200">
                    </div>
                    
                    <!-- 2. เปลี่ยนชื่อ (ถ้ามี) -->
                    <div>
                        <label class="block font-semibold mb-2">2. สำเนาใบเปลี่ยนชื่อ-สกุล / ใบทะเบียนสมรส <span class="text-gray-500 font-normal">(ถ้ามี)</span></label>
                        <input type="file" name="fileNameChange" accept=".pdf,.jpg,.jpeg,.png" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 focus:ring-2 focus:ring-pink-200">
                    </div>
                    
                    <!-- 3. ใบประกอบวิชาชีพ -->
                    <div>
                        <label class="block font-semibold mb-2">3. สำเนาใบอนุญาตประกอบวิชาชีพเวชกรรม / หนังสือรับรอง</label>
                        <input type="file" name="fileLicense" accept=".pdf,.jpg,.jpeg,.png" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 focus:ring-2 focus:ring-pink-200">
                    </div>
                    
                    <!-- 4. เพิ่มพูนทักษะ -->
                    <div>
                        <label class="block font-semibold mb-2">4. สำเนาประกาศนียบัตร / ใบรับรองผ่านเพิ่มพูนทักษะ</label>
                        <input type="file" name="fileIntern" accept=".pdf,.jpg,.jpeg,.png" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 focus:ring-2 focus:ring-pink-200">
                    </div>

                    <!-- 5. ต้นสังกัด -->
                    <div>
                        <label class="block font-semibold mb-2">5. หนังสือจากต้นสังกัด อนุมัติให้เข้าฝึกอบรม <span class="text-gray-500 font-normal">(เฉพาะผู้มีต้นสังกัด)</span></label>
                        <input type="file" name="fileSponsor" accept=".pdf,.jpg,.jpeg,.png" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 focus:ring-2 focus:ring-pink-200">
                    </div>
                    
                    <!-- 6. Transcript -->
                    <div>
                        <label class="block font-semibold mb-2">6. ใบแสดงผลการศึกษา (Transcript) แพทยศาสตร์</label>
                        <input type="file" name="fileTranscript" accept=".pdf,.jpg,.jpeg,.png" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 focus:ring-2 focus:ring-pink-200">
                    </div>

                    <!-- 7. ศรว -->
                    <div>
                        <label class="block font-semibold mb-2">7. เอกสารผลคะแนน ศรว. (NL)</label>
                        <input type="file" name="fileNL" accept=".pdf,.jpg,.jpeg,.png" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 focus:ring-2 focus:ring-pink-200">
                    </div>

                    <!-- 8. CV -->
                    <div>
                        <label class="block font-semibold mb-2">8. ประวัติย่อ (CV) <span class="text-gray-500 font-normal">ความยาวไม่เกิน 2 หน้า</span></label>
                        <input type="file" name="fileCV" accept=".pdf,.jpg,.jpeg,.png" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 focus:ring-2 focus:ring-pink-200">
                    </div>
                    
                    <!-- 9. Portfolio -->
                    <div class="md:col-span-2">
                        <label class="block font-semibold mb-2">9. Portfolio <span class="text-gray-500 font-normal">(จะมีหรือไม่มีก็ได้)</span></label>
                        <input type="file" name="filePortfolio" accept=".pdf,.jpg,.jpeg,.png" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 focus:ring-2 focus:ring-pink-200">
                    </div>

                    <!-- กล่องพิเศษสำหรับเอกสารที่อัปโหลดได้หลายไฟล์ (เน้นสีให้ผู้สมัครเห็นชัด) -->
                    <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6 mt-2">
                        
                        <!-- 10. หนังสือรับรอง (MULTIPLE) -->
                        <div class="bg-pink-50 p-5 rounded-xl border border-pink-200 shadow-sm">
                            <label class="block font-bold text-chula mb-2">10. หนังสือรับรอง/แนะนำผู้สมัคร <span class="text-gray-600 font-normal">(ถ้ามี)</span></label>
                            <span class="inline-block bg-pink-100 text-pink-700 text-sm px-2 py-1 rounded mb-3">อัปโหลดได้หลายไฟล์</span>
                            <input type="file" name="fileRecLetter" multiple accept=".pdf,.jpg,.jpeg,.png" class="w-full border border-gray-300 p-2.5 rounded-lg bg-white focus:ring-2 focus:ring-pink-300">
                        </div>

                        <!-- 11. ใบรับรองแพทย์ (MULTIPLE) -->
                        <div class="bg-pink-50 p-5 rounded-xl border border-pink-200 shadow-sm">
                            <label class="block font-bold text-chula mb-2">11. ใบรับรองแพทย์ และเอกสารตรวจตาสามมิติ</label>
                            <span class="inline-block bg-pink-100 text-pink-700 text-sm px-2 py-1 rounded mb-3">อัปโหลดได้หลายไฟล์</span>
                            <input type="file" name="fileMedical" multiple accept=".pdf,.jpg,.jpeg,.png" class="w-full border border-gray-300 p-2.5 rounded-lg bg-white focus:ring-2 focus:ring-pink-300">
                        </div>
                        
                    </div>
                </div>
            </section>
